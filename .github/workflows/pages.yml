name: Deploy zipped site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site folder
        run: |
          rm -rf public tmp_site
          mkdir public tmp_site
          unzip -q site.zip -d tmp_site

          if [ -f "tmp_site/index.html" ]; then
            cp -r tmp_site/* public/
          else
            INNER_DIR=$(find tmp_site -mindepth 1 -maxdepth 1 -type d | head -n 1)
            cp -r "$INNER_DIR"/* public/
          fi

          test -f public/index.html
          ls -la public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
